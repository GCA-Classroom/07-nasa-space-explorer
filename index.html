<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>NASA Space Explorer</title>

  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">

    <!-- Header -->
    <header class="site-header">
      <img
        src="img/nasa-worm-logo.png"
        alt="NASA Logo"
        class="logo"
      />

      <div>
        <p class="header-label">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <main>

      <!-- Extra credit: random space fact -->
      <section class="fact-section">
        <h2>Did You Know?</h2>
        <p id="spaceFact">Loading a random space fact...</p>
      </section>

      <!-- Date filters -->
      <section class="filters" aria-label="NASA APOD date filters">

        <div class="date-field">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" />
        </div>

        <div class="date-field">
          <label for="endDate">End Date</label>
          <input type="date" id="endDate" />
        </div>

        <button id="getImagesButton" type="button">
          Get Space Images
        </button>

      </section>

      <!-- Loading and error messages -->
      <div
        id="statusMessage"
        class="status-message"
        role="status"
        aria-live="polite"
      ></div>

      <!-- Gallery -->
      <section id="gallery" class="gallery">
        <div class="placeholder">
          <div class="placeholder-icon">🔭</div>

          <p>
            Select a date range and click “Get Space Images”
            to explore the cosmos!
          </p>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal -->
  <div
    id="apodModal"
    class="modal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <div class="modal-content">

      <button
        id="closeModalButton"
        class="close-modal"
        type="button"
        aria-label="Close NASA image details"
      >
        &times;
      </button>

      <div id="modalMedia" class="modal-media"></div>

      <div class="modal-information">
        <p id="modalDate" class="modal-date"></p>

        <h2 id="modalTitle"></h2>

        <p id="modalExplanation"></p>
      </div>

    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
